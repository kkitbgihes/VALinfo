[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Valinfo"
version = "2.0.0"
description = "OpenSource tracker for VALORANT"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.4", "requests>=2.31"]

[project.gui-scripts]
valinfo = "valinfo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valinfo = ["i18n/locales/*.json", "i18n/locales/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
